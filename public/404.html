<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>TSRP Staff Panel</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages -- https://github.com/rafgraph/spa-github-pages
      // GitHub Pages has no server-side routing: a refresh on any non-root
      // path (e.g. /internalaffairs) hits this 404 page directly instead of
      // index.html. This redirects back to the root with the real path
      // packed into a query string, which index.html's matching script then
      // unpacks via history.replaceState before React Router ever sees it --
      // so the URL ends up exactly where it started, just without a real
      // page reload in between.
      var pathSegmentsToKeep = 0; // served at the domain root (tsrp.online), not a /repo-name/ subpath

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
